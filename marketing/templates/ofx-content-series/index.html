const frame = document.getElementById('email');
function showEmail(index) {
  const item = emails[index];
  document.getElementById('subject').textContent = item.subject;
  document.getElementById('preheader').textContent = item.preheader;
  document.getElementById('source').href = item.id + '.html';
  frame.srcdoc = item.html.replaceAll('{{ name }}', 'Marina').replaceAll('{{ unsubscribe_url }}', '#descadastro').replaceAll('{{ sender_company }}', 'OFX Simples').replaceAll('{{ sender_address }}', 'Endereço do remetente · preencher antes do envio');
  document.querySelectorAll('[data-email]').forEach(button => button.setAttribute('aria-pressed', String(Number(button.dataset.email) === index)));
}
document.querySelectorAll('[data-email]').forEach(button => button.addEventListener('click', () => showEmail(Number(button.dataset.email))));
for (const mode of ['desktop', 'mobile']) document.getElementById(mode).addEventListener('click', () => {
  frame.classList.toggle('mobile', mode === 'mobile');
  document.getElementById('desktop').setAttribute('aria-pressed', String(mode === 'desktop'));
  document.getElementById('mobile').setAttribute('aria-pressed', String(mode === 'mobile'));
});
showEmail(0);
