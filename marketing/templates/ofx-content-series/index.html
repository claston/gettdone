const emails = [{"id": "01-organizacao", "subject": "Antes de converter: 4 detalhes para conferir no seu extrato", "preheader": "PDF do banco, impressão, digitalização e descrições: veja o que pode dificultar a leitura.", "html": "<!doctype html>\n<html lang=\"pt-BR\" xmlns=\"http://www.w3.org/1999/xhtml\" xmlns:o=\"urn:schemas-microsoft-com:office:office\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <meta name=\"x-apple-disable-message-reformatting\">\n  <meta name=\"format-detection\" content=\"telephone=no,date=no,address=no,email=no,url=no\">\n  <title>Antes de converter: 4 detalhes para conferir no seu extrato</title>\n  <!--[if mso]><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml><![endif]-->\n  <style>\n    body, table, td, a { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }\n    table, td { mso-table-lspace:0pt; mso-table-rspace:0pt; }\n    a[x-apple-data-detectors] { color:inherit !important; text-decoration:none !important; }\n    @media screen and (max-width:620px) {\n      .outer { padding:16px 8px !important; }\n      .pad { padding-left:24px !important; padding-right:24px !important; }\n      .example { padding:14px !important; }\n      .document { font-size:11px !important; }\n      .headline { font-size:30px !important; line-height:36px !important; }\n    }\n  </style>\n</head>\n<body style=\"margin:0;padding:0;width:100%;background-color:#f2f5fa;font-family:Arial,Helvetica,sans-serif;color:#172b4d;\">\n  <div style=\"display:none;font-size:1px;line-height:1px;color:#f2f5fa;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;\">PDF do banco, impressão, digitalização e descrições: veja o que pode dificultar a leitura.</div>\n  <table role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" bgcolor=\"#f2f5fa\" style=\"width:100%;background-color:#f2f5fa;\">\n    <tr><td class=\"outer\" align=\"center\" style=\"font-family:Arial,Helvetica,sans-serif;padding:36px 12px;\">\n      <!--[if mso]><table role=\"presentation\" width=\"600\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\"><tr><td><![endif]-->\n      <table role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" style=\"width:100%;max-width:600px;\">\n        <tr><td class=\"pad\" bgcolor=\"#003ec7\" style=\"font-family:Arial,Helvetica,sans-serif;padding:26px 40px;background-color:#003ec7;border-radius:16px 16px 0 0;\">\n          <a href=\"https://www.ofxsimples.com.br/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"font-family:Arial,Helvetica,sans-serif;font-size:25px;line-height:32px;letter-spacing:-0.8px;text-decoration:none;color:#ffffff;\"><strong>OFX</strong> Simples<span style=\"color:#b9d1ff;\">.</span></a>\n          <p style=\"margin:5px 0 0;font-size:12px;line-height:18px;color:#e0eaff;\">Pequenos cuidados. Uma conversão mais confiável.</p>\n        </td></tr>\n        <tr><td class=\"pad\" bgcolor=\"#ffffff\" style=\"font-family:Arial,Helvetica,sans-serif;padding:34px 40px 8px;background-color:#ffffff;\">\n<p style=\"margin:0 0 14px;font-size:11px;line-height:20px;color:#003ec7;\">ANTES DE CONVERTER · GUIA 01</p>\n<h1 class=\"headline\" style=\"margin:0 0 24px;font-family:Arial,Helvetica,sans-serif;font-size:36px;line-height:41px;letter-spacing:-1px;color:#172b4d;\">Uma boa conversão começa no arquivo.</h1>\n<p style=\"margin:0 0 16px;font-size:16px;line-height:25px;color:#435168;\">Olá, {{ name }}!</p>\n<p style=\"margin:0 0 16px;font-size:16px;line-height:25px;color:#435168;\">Dois PDFs do mesmo banco podem parecer iguais e ser bem diferentes por dentro. A forma de baixar, imprimir ou digitalizar muda o que uma ferramenta consegue ler.</p>\n<p style=\"margin:0 0 16px;font-size:16px;line-height:25px;color:#435168;\">Estes são alguns dos cuidados que aprendemos ao trabalhar com extratos no OFX Simples.</p>\n<p style=\"margin:0 0 22px;font-size:12px;line-height:21px;color:#64748b;\">Exemplos ilustrativos, com dados fictícios.</p>\n<h2 style=\"margin:0 0 10px;font-size:20px;line-height:27px;color:#172b4d;\"><span style=\"color:#003ec7;\">01.</span> Baixar e imprimir são caminhos diferentes</h2>\n<p style=\"margin:0 0 16px;font-size:15px;line-height:24px;color:#435168;\">O PDF baixado em <strong>“Baixar” ou “Exportar” no site ou app do banco</strong> costuma preservar melhor o texto e as colunas. Já “Imprimir / Salvar como PDF” pode reorganizar o conteúdo.</p>\n<table role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" style=\"width:100%;margin:0 0 12px;\">\n<tr><td class=\"example\" bgcolor=\"#eff8f4\" style=\"padding:18px;border:1px solid #cde6da;border-radius:8px;background-color:#eff8f4;\">\n<p style=\"margin:0 0 12px;font-size:11px;line-height:17px;letter-spacing:0.5px;font-weight:bold;color:#226344;\">DOWNLOAD DO BANCO · PREFIRA O ORIGINAL</p>\n<table class=\"document\" role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" bgcolor=\"#ffffff\" style=\"width:100%;background-color:#ffffff;font-family:'Courier New',monospace;font-size:12px;line-height:19px;color:#172b4d;\">\n<tr><td  style=\"padding:10px 7px;border-bottom:1px solid #e4eaf3;\">Data</td><td  style=\"padding:10px 7px;border-bottom:1px solid #e4eaf3;\">Descrição</td><td align=\"right\" style=\"padding:10px 7px;border-bottom:1px solid #e4eaf3;\">Valor (R$)</td></tr>\n<tr><td  style=\"padding:10px 7px;white-space:nowrap;\">05/11</td><td  style=\"padding:10px 7px;\">PIX RECEBIDO</td><td align=\"right\" style=\"padding:10px 7px;white-space:nowrap;\">+ 850,00</td></tr>\n</table>\n<p style=\"margin:10px 0 0;font-size:13px;line-height:22px;color:#226344;\">Data, descrição e valor juntos na mesma linha.</p>\n</td></tr></table>\n<table role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" style=\"width:100%;margin:0 0 12px;\">\n<tr><td class=\"example\" bgcolor=\"#fff8ed\" style=\"padding:18px;border:1px solid #eedbb8;border-radius:8px;background-color:#fff8ed;\">\n<p style=\"margin:0 0 12px;font-size:11px;line-height:17px;letter-spacing:0.5px;font-weight:bold;color:#865218;\">Impressão em PDF · o que pode mudar</p>\n<table class=\"document\" role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" bgcolor=\"#ffffff\" style=\"width:100%;background-color:#ffffff;font-family:'Courier New',monospace;font-size:12px;line-height:19px;color:#172b4d;\">\n<tr><td  style=\"padding:10px 7px;\">05/11 &nbsp; PIX RECEBIDO</td></tr>\n<tr><td  style=\"padding:10px 7px;padding:5px 10px;border-top:2px dashed #d9bb8d;border-bottom:2px dashed #d9bb8d;font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#865218;\">Quebra de página</td></tr>\n<tr><td align=\"right\" style=\"padding:10px 7px;\">+ 850,00</td></tr>\n</table>\n<p style=\"margin:10px 0 0;font-size:13px;line-height:22px;color:#865218;\">A coluna de valores pode ir parar em outra página.</p>\n</td></tr></table>\n<p style=\"margin:0 0 26px;font-size:14px;line-height:23px;color:#435168;\"><strong>Na prática:</strong> Prefira o download original. Um PDF impresso ainda pode funcionar e conter texto selecionável; confira se todas as colunas foram preservadas.</p>\n<h2 style=\"margin:0 0 10px;padding-top:24px;border-top:1px solid #e4eaf3;font-size:20px;line-height:27px;color:#172b4d;\"><span style=\"color:#003ec7;\">02.</span> Página torta, leitura mais difícil</h2>\n<p style=\"margin:0 0 16px;font-size:15px;line-height:24px;color:#435168;\">Ao escanear o papel ou fotografar uma página, o texto vira imagem. A leitura por reconhecimento de caracteres (OCR) fica mais difícil com inclinação, sombras ou desfoque.</p>\n<table role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" style=\"width:100%;margin:0 0 12px;\">\n<tr><td class=\"example\" bgcolor=\"#f5f7fb\" style=\"padding:18px;border:1px solid #dbe3ef;border-radius:8px;background-color:#f5f7fb;\">\n<p style=\"margin:0 0 12px;font-size:11px;line-height:17px;letter-spacing:0.5px;font-weight:bold;color:#536178;\">EXEMPLO · UMA LINHA INCLINADA</p>\n<table class=\"document\" role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" bgcolor=\"#ffffff\" style=\"width:100%;background-color:#ffffff;font-family:'Courier New',monospace;font-size:12px;line-height:19px;color:#172b4d;\">\n<tr><td valign=\"top\" style=\"padding:10px 7px;padding:10px 7px 28px;white-space:nowrap;\">06/11</td><td valign=\"top\" style=\"padding:10px 7px;padding:19px 4px;\">TARIFA</td><td align=\"right\" valign=\"top\" style=\"padding:10px 7px;padding:28px 7px 10px;white-space:nowrap;\">− 18,90</td></tr>\n</table>\n<p style=\"margin:10px 0 0;font-size:13px;line-height:22px;color:#536178;\">A inclinação pode dificultar a associação entre data e valor.</p>\n</td></tr></table>\n<p style=\"margin:0 0 26px;font-size:14px;line-height:23px;color:#435168;\"><strong>Na prática:</strong> Digitalize com a folha reta, inteira e nítida. Antes de enviar, amplie um valor e confira se dá para distinguir os dígitos, a vírgula e o sinal.</p>\n<h2 style=\"margin:0 0 10px;padding-top:24px;border-top:1px solid #e4eaf3;font-size:20px;line-height:27px;color:#172b4d;\"><span style=\"color:#003ec7;\">03.</span> Um corte pode levar parte do valor</h2>\n<p style=\"margin:0 0 16px;font-size:15px;line-height:24px;color:#435168;\">Uma margem cortada pode esconder centavos, o sinal de débito ou parte da data. Uma página ausente também deixa movimentos de fora.</p>\n<table role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" style=\"width:100%;margin:0 0 12px;\">\n<tr><td class=\"example\" bgcolor=\"#fff3f1\" style=\"padding:18px;border:1px solid #f0d1cb;border-radius:8px;background-color:#fff3f1;\">\n<p style=\"margin:0 0 12px;font-size:11px;line-height:17px;letter-spacing:0.5px;font-weight:bold;color:#9a3e31;\">EXEMPLO · BORDA DIREITA CORTADA</p>\n<table class=\"document\" role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" bgcolor=\"#ffffff\" style=\"width:100%;background-color:#ffffff;font-family:'Courier New',monospace;font-size:12px;line-height:19px;color:#172b4d;\">\n<tr><td  style=\"padding:10px 7px;white-space:nowrap;\">07/11</td><td  style=\"padding:10px 7px;\">PAGAMENTO</td><td align=\"right\" style=\"padding:10px 7px;background-color:#ffe3de;border-right:3px dashed #bd5747;white-space:nowrap;\">− 1.2…</td></tr>\n</table>\n<p style=\"margin:10px 0 0;font-size:13px;line-height:22px;color:#9a3e31;\">O valor está incompleto. Não dá para confirmar quanto saiu.</p>\n</td></tr></table>\n<p style=\"margin:0 0 26px;font-size:14px;line-height:23px;color:#435168;\"><strong>Na prática:</strong> Baixe novamente ou refaça a digitalização com todas as bordas e páginas. A informação que ficou fora do arquivo precisa ser recuperada na origem.</p>\n<h2 style=\"margin:0 0 10px;padding-top:24px;border-top:1px solid #e4eaf3;font-size:20px;line-height:27px;color:#172b4d;\"><span style=\"color:#003ec7;\">04.</span> Mesmo banco, uma linha diferente</h2>\n<p style=\"margin:0 0 16px;font-size:15px;line-height:24px;color:#435168;\">Mesmo em um layout conhecido, uma descrição longa pode ocupar duas linhas. Números no histórico também podem se parecer com datas ou valores.</p>\n<table role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" style=\"width:100%;margin:0 0 12px;\">\n<tr><td class=\"example\" bgcolor=\"#eef4ff\" style=\"padding:18px;border:1px solid #d0def7;border-radius:8px;background-color:#eef4ff;\">\n<p style=\"margin:0 0 12px;font-size:11px;line-height:17px;letter-spacing:0.5px;font-weight:bold;color:#003ec7;\">EXEMPLO · DUAS LINHAS, UM MOVIMENTO</p>\n<table class=\"document\" role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" bgcolor=\"#ffffff\" style=\"width:100%;background-color:#ffffff;font-family:'Courier New',monospace;font-size:12px;line-height:19px;color:#172b4d;border-left:3px solid #003ec7;\">\n<tr><td valign=\"top\" style=\"padding:10px 7px;padding:10px 6px 2px;white-space:nowrap;\">08/11</td><td  style=\"padding:10px 7px;padding:10px 4px 2px;\">PIX ENVIADO</td><td align=\"right\" valign=\"top\" style=\"padding:10px 7px;padding:10px 6px 2px;white-space:nowrap;\">− 320,00</td></tr>\n<tr><td  style=\"padding:10px 7px;padding:0 6px 10px;\">&nbsp;</td><td colspan=\"2\" style=\"padding:10px 7px;padding:0 4px 10px;color:#003ec7;\">LOJA EXEMPLO · PEDIDO 1234</td></tr>\n</table>\n<p style=\"margin:10px 0 0;font-size:13px;line-height:22px;color:#003ec7;\">A segunda linha completa a descrição; “1234” é a referência do pedido.</p>\n</td></tr></table>\n<p style=\"margin:0 0 26px;font-size:14px;line-height:23px;color:#435168;\"><strong>Na prática:</strong> Confira descrições que continuam na linha seguinte. Reconhecer o modelo do extrato ajuda, mas cada movimentação ainda precisa ser interpretada no contexto.</p>\n<table role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" style=\"width:100%;margin:0 0 24px;\">\n<tr><td class=\"example\" bgcolor=\"#172b4d\" style=\"padding:24px;border-radius:8px;background-color:#172b4d;\">\n<h2 style=\"margin:0 0 12px;font-size:21px;line-height:28px;color:#ffffff;\">Precisão também é saber quando pedir uma conferência.</h2>\n<p style=\"margin:0 0 12px;font-size:15px;line-height:24px;color:#e0eaff;\">O OFX Simples prioriza a fidelidade às informações do documento: datas, valores e o sentido de cada entrada ou saída.</p>\n<p style=\"margin:0;font-size:15px;line-height:24px;color:#e0eaff;\">Quando uma informação não pode ser confirmada, a conversão pode exigir revisão ou não ser concluída. Um dado ilegível precisa ser conferido na origem. A ferramenta não deve adivinhar o que falta.</p>\n</td></tr></table>\n<p style=\"margin:0 0 16px;font-size:15px;line-height:24px;color:#435168;\">< \n</html>\n"}, {"id": "02-revisao", "subject": "Você consegue explicar de onde veio esse número?", "preheader": "Um registro com três campos pode ajudar a organizar as pendências da revisão contábil.", "html": "<!doctype html>\n<html lang=\"pt-BR\" xmlns=\"http://www.w3.org/1999/xhtml\" xmlns:o=\"urn:schemas-microsoft-com:office:office\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <meta name=\"x-apple-disable-message-reformatting\">\n  <meta name=\"format-detection\" content=\"telephone=no,date=no,address=no,email=no,url=no\">\n  <title>Você consegue explicar de onde veio esse número?</title>\n  <!--[if mso]><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml><![endif]-->\n  <style>\n    body, table, td, a { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }\n    table, td { mso-table-lspace:0pt; mso-table-rspace:0pt; }\n    a[x-apple-data-detectors] { color:inherit !important; text-decoration:none !important; }\n    @media screen and (max-width:620px) {\n      .outer { padding:16px 8px !important; }\n      .pad { padding-left:24px !important; padding-right:24px !important; }\n      .headline { font-size:30px !important; line-height:36px !important; }\n    }\n  </style>\n</head>\n<body style=\"margin:0;padding:0;width:100%;background-color:#f2f5fa;font-family:Arial,Helvetica,sans-serif;color:#172b4d;\">\n  <div style=\"display:none;font-size:1px;line-height:1px;color:#f2f5fa;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;\">Um registro com três campos pode ajudar a organizar as pendências da revisão contábil.</div>\n  <table role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" border=\"0\" bgcolor=\"#f2f5fa\" style=\"width:100%;background-color:#f2f5fa;\">\n    <tr><td class=\"outer\" align=\"center\" style=\"font-family:Arial,Helvetica,sans-serif;padding:36px 12px;\">\n      <!--[if mso]><table role=\ const frame = document.getElementById('email');
let contentObserver;
frame.addEventListener('load', () => {
  contentObserver?.disconnect();
  const body = frame.contentDocument?.body;
  if (!body) return;
  const fitContent = () => {
    frame.style.height = Math.ceil(body.getBoundingClientRect().height) + 2 + 'px';
  };
  contentObserver = new ResizeObserver(fitContent);
  contentObserver.observe(body);
  fitContent();
});
function showEmail(index) {
  const item = emails[index];
  document.getElementById('subject').textContent = item.subject;
  document.getElementById('preheader').textContent = item.preheader;
  document.getElementById('source').href = item.id + '.html';
  frame.srcdoc = item.html.replaceAll('{{ name }}', 'Marina').replaceAll('{{ unsubscribe_url }}', '#descadastro').replaceAll('{{ sender_company }}', 'OFX Simples').replaceAll('{{ sender_address }}', 'Endereço do remetente · preencher antes do envio');
  document.querySelectorAll('[data-email]').forEach(button => button.setAttribute('aria-pressed', String(Number(button.dataset.email) === index)));
}
document.querySelectorAll('[data-email]').forEach(button => button.addEventListener('click', () => showEmail(Number(button.dataset.email))));
for (const mode of ['desktop', 'mobile']) document.getElementById(mode).addEventListener('click', () => {
  frame.classList.toggle('mobile', mode === 'mobile');
  document.getElementById('desktop').setAttribute('aria-pressed', String(mode === 'desktop'));
  document.getElementById('mobile').setAttribute('aria-pressed', String(mode === 'mobile'));
});
showEmail(0);
