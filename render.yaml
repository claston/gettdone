services:
  - type: web
    name: ofxsimples-pro-preview
    runtime: node
    plan: free
    rootDir: pro
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /dashboard
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
