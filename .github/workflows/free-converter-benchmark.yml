name: Free converter performance comparison

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Reference commit before the Core change
        required: true
      repeat:
        description: Measured repetitions per fixture (minimum 5)
        default: "10"
        required: true

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install existing dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compare identical fictional corpus on the same runner
        env:
          BASE_REF: ${{ inputs.base_ref }}
          REPEAT: ${{ inputs.repeat }}
        run: >-
          python scripts/check_pdf_compatibility.py --base-ref "$BASE_REF"
          --repeat "$REPEAT" --performance-gate --profile github-ubuntu-local
      - name: Preserve baseline, candidate, corpus and explicit differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-converter-performance
          path: tmp/pdf-compatibility/
          if-no-files-found: error
