name: CI | Lint and Tests

on:
  push:
    branches:
      - main
      - integration-normalization-engine
      - "refactor/**"
      - "test/**"
      - "ci/**"
      - "audit/**"
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "docs/**"
  pull_request:
    branches:
      - main
      - integration-normalization-engine

permissions:
  contents: read

jobs:
  pro-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: pro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /

      - name: Set up Python for browser acceptance
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install browser acceptance dependencies
        working-directory: .
        run: |
          python -m pip install -r backend/requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Browser acceptance and performance budgets
        working-directory: .
        run: |
          mkdir -p tmp/pro-workspace-acceptance
          npm --prefix pro run start -- -H 127.0.0.1 -p 3100 > tmp/pro-workspace-acceptance/server.log 2>&1 &
          pro_pid=$!
          trap 'kill "$pro_pid"' EXIT
          python scripts/smoke_pro_workspace.py --url http://127.0.0.1:3100 --save-receipt-delay-ms 6000
          python scripts/smoke_pro_pdf_sync.py --url http://127.0.0.1:3100
          python scripts/smoke_pro_financial_reports.py --url http://127.0.0.1:3100
          python scripts/smoke_pro_idle_navigation.py --url http://127.0.0.1:3100

      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pro-workspace-acceptance
          path: |
            tmp/pro-workspace-acceptance/
            tmp/pro-pdf-sync/
            tmp/pro-financial-reports/
            tmp/pro-idle-navigation/
          if-no-files-found: ignore

  pdf-golden:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run PDF golden marker tests
        run: python -m pytest -m pdf_golden -q

  lint-and-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright
        run: python -m pip install playwright

      - name: Install Playwright browser (Chromium)
        run: python -m playwright install chromium

      - name: Frontend text lint (UTF-8 and mojibake)
        working-directory: .
        run: python scripts/lint_frontend_text.py

      - name: Frontend navigation lint (links and route-safe auth paths)
        working-directory: .
        run: python scripts/lint_frontend_navigation.py

      - name: Frontend navigation smoke (Playwright)
        working-directory: .
        run: python scripts/smoke_playwright_navigation.py

      - name: Lint (Ruff)
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -m "not pdf_golden" -q -n 4 --dist=worksteal
