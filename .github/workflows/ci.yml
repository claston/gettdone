name: CI | Lint and Tests

on:
  push:
    branches:
      - main
      - integration-normalization-engine
      - "refactor/**"
      - "test/**"
      - "ci/**"
      - "audit/**"
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "docs/**"
  pull_request:
    branches:
      - main
      - integration-normalization-engine

permissions:
  contents: read

jobs:
  pro-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: pro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  pro-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [workspace, pdf, works]
    defaults:
      run:
        working-directory: pro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: pro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /

      - name: Set up Python for browser acceptance
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-pro-browser.txt

      - name: Install browser Python dependencies
        working-directory: .
        run: python -m pip install -r scripts/requirements-pro-browser.txt

      - name: Install disposable backend for statement work acceptance
        if: matrix.suite == 'works'
        working-directory: .
        run: python -m pip install -r backend/requirements.txt

      - name: Prefer official Ubuntu HTTPS archive
        working-directory: .
        run: sudo python3 scripts/configure_pro_apt_mirror.py

      - name: Install browser operating system dependencies
        working-directory: .
        run: python -m playwright install-deps chromium

      - name: Install headless Chromium
        working-directory: .
        run: python -m playwright install --only-shell chromium

      - name: Browser acceptance and performance budgets
        working-directory: .
        run: |
          mkdir -p tmp/pro-workspace-acceptance
          npm --prefix pro run start -- -H 127.0.0.1 -p 3100 > tmp/pro-workspace-acceptance/server.log 2>&1 &
          pro_pid=$!
          trap 'kill "$pro_pid"' EXIT
          python scripts/run_pro_browser_suite.py --suite "${{ matrix.suite }}" --url http://127.0.0.1:3100

      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pro-workspace-acceptance-${{ matrix.suite }}
          path: |
            tmp/pro-workspace-acceptance/
            tmp/pro-pdf-sync/
            tmp/pro-financial-reports/
            tmp/pro-idle-navigation/
            tmp/pro-organization/
            tmp/pro-browser-suites/
            tmp/ofx61-browser/
          if-no-files-found: ignore

  # Keep the required check and worker release contract unchanged. A skipped
  # prerequisite must fail this aggregate instead of reporting a green skip.
  pro-quality:
    runs-on: ubuntu-latest
    needs: [pro-checks, pro-browser]
    if: ${{ always() }}
    steps:
      - name: Require all PRO validations
        env:
          PRO_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ["PRO_RESULTS"])
          if set(results) != {"pro-checks", "pro-browser"} or any(
              job.get("result") != "success" for job in results.values()
          ):
              raise SystemExit("PRO quality failed: " + json.dumps(results, sort_keys=True))
          print("All PRO unit tests, lint, types, builds and browser contracts passed.")
          PY

  pdf-golden:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run PDF golden marker tests
        run: python -m pytest -m pdf_golden -q

  lint-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres-organization:
        image: postgres:16
        env:
          POSTGRES_DB: ofx24_test
          POSTGRES_USER: ofx24_test
          POSTGRES_PASSWORD: local-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ofx24_test -d ofx24_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright
        run: python -m pip install playwright

      - name: Install Playwright browser (Chromium)
        run: python -m playwright install chromium

      - name: Frontend text lint (UTF-8 and mojibake)
        working-directory: .
        run: python scripts/lint_frontend_text.py

      - name: Frontend navigation lint (links and route-safe auth paths)
        working-directory: .
        run: python scripts/lint_frontend_navigation.py

      - name: Frontend navigation smoke (Playwright)
        working-directory: .
        run: python scripts/smoke_playwright_navigation.py

      - name: Admin PDF metrics smoke (desktop and mobile)
        working-directory: .
        run: python scripts/smoke_admin_pdf_metrics.py

      - name: Lint (Ruff)
        run: python -m ruff check .

      - name: Validate organization and admin metrics PostgreSQL upgrades and rollback
        env:
          PRO_ORGANIZATION_TEST_DATABASE_URL: postgresql://ofx24_test:local-ci-test-only@127.0.0.1:5432/ofx24_test
          ADMIN_METRICS_TEST_DATABASE_URL: postgresql://ofx24_test:local-ci-test-only@127.0.0.1:5432/ofx24_test
        run: python -m pytest tests/test_pro_organization_postgres.py tests/test_statement_period_migration.py -q

      - name: Run tests
        run: python -m pytest -m "not pdf_golden" -q -n 4 --dist=worksteal

      - name: PDF product compatibility gate against base revision
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          baseline_ref="$BASE_SHA"
          if [ -z "$baseline_ref" ] || [ "$baseline_ref" = "0000000000000000000000000000000000000000" ]; then
            baseline_ref="origin/main"
          fi
          python scripts/check_pdf_compatibility.py --base-ref "$baseline_ref"

      - name: Preserve fictional PDF compatibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-compatibility-${{ github.event_name }}
          path: tmp/pdf-compatibility/
          if-no-files-found: ignore
