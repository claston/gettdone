AWSTemplateFormatVersion: '2010-09-09'
Description: One-time artifact storage and narrowly scoped CloudFormation release role for the fiscal worker.
Rules:
  ExpectedRegion:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', us-east-1]
        AssertDescription: The production worker release is scoped to us-east-1.
Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'gettdone-classification-artifacts-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt ArtifactBucket.Arn, !Sub '${ArtifactBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
  ReleaseExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /gettdone/
      RoleName: GettDoneClassificationCloudFormationExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudformation.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FiscalLambdaRelease
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:ListTags
                  - lambda:GetRuntimeManagementConfig
                  - lambda:GetFunctionCodeSigningConfig
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:gettdone-classification-shadow-worker'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/gettdone/GettDoneClassificationRuntimeRole'
                Condition: {StringEquals: {'iam:PassedToService': lambda.amazonaws.com}}
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub '${ArtifactBucket.Arn}/classification-shadow/releases/*'
Outputs:
  ArtifactBucket: {Value: !Ref ArtifactBucket}
  ReleaseExecutionRoleArn: {Value: !GetAtt ReleaseExecutionRole.Arn}
