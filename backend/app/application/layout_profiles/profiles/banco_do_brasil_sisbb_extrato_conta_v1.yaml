layout_profile:
  schema_version: 2
  profile_name: banco_do_brasil_sisbb_extrato_conta_v1
  bank: Banco do Brasil
  layout_family: banco_do_brasil_sisbb_extrato_conta
  statement_type: conta_corrente_extrato
  confidence: high
  classifier:
    required_keywords:
      - "Extrato de Conta"
      - "Conta Corrente"
      - "Data Dia Histórico Lote Banco Origem Documento"
      - "Valor - R$"
      - "Saldo - R$"
      - "SISBB 25030"
    optional_keywords:
      - "Posição"
      - "Data de emissão"
      - "Agência (prefixo/dv)"
      - "Conta nº/dv"
      - "Mod. 0.51.291-3"
      - "BB Responde"
    negative_keywords:
      - "Fatura"
      - "Cartão de Crédito"
      - "Comprovante"
      - "Extrato de Conta Corrente - Autorizável"
    min_score_hint: 0.85
  table_detection:
    header_keywords:
      - "Data"
      - "Histórico"
      - "Documento"
      - "Valor - R$"
      - "Saldo - R$"
    expected_column_order:
      - date
      - description
      - amount
      - balance
    column_aliases:
      date:
        - "Data"
      description:
        - "Histórico"
      amount:
        - "Valor - R$"
        - "Valor"
      balance:
        - "Saldo - R$"
        - "Saldo"
    table_starts_after:
      - "Data Dia Histórico Lote Banco Origem Documento Valor - R$ Saldo - R$"
    row_separator_hint: "transaction row starts with dd.MM.yyyy; C/D suffix defines amount and balance signs"
  parsing:
    date_formats:
      - "dd.MM.yyyy"
    date_year_source: transaction
    amount_locale: pt-BR
    decimal_separator: ","
    thousands_separator: "."
    negative_patterns:
      - "{amount} D"
      - "{amount}D"
    positive_patterns:
      - "{amount} C"
      - "{amount}C"
    ignore_rows:
      - "Data Dia Histórico Lote Banco Origem Documento Valor - R$ Saldo - R$"
      - "Bloqueado - R$"
      - "Disponível - R$"
      - "CPMF cobrado - R$"
      - "Folha"
    opening_balance_rows:
      - "Saldo anterior"
    opening_balance_policy: skip
    required_transaction_fields:
      - date
      - description
      - amount
    optional_transaction_fields:
      - document
      - balance
