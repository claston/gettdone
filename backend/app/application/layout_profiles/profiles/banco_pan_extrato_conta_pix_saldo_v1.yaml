      - "Período do extrato"
      - "Saldo nesse período"
      - "Entrou na sua conta"
      - "Saiu da sua conta"
      - "Agência"
      - "Conta"
      - "Extrato de"
      - "Suas movimentações"
      - "Crédito Pix"
      - "Débito Pix"
      - "Pix recebido"
      - "Pix enviado"
    optional_keywords:
      - "Esse é o seu extrato"
      - "da sua conta Pan"
      - "Pagamentos feitos"
      - "Transferências feitas"
      - "Saques feitos"
      - "Total em tarifas"
      - "Extrato emitido em"
      - "Página"
    negative_keywords:
      - "Santander"
      - "Banco do Brasil"
      - "Bradesco"
      - "CAIXA"
      - "Itaú"
      - "Nubank"
      - "Banco Inter"
      - "SICOOB"
      - "Sicredi"
