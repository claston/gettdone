      - "Suas movimentações"
    row_separator_hint: "transaction row starts with dd/MM and a numeric transaction id; amount and running balance are right-aligned"
  parsing:
    date_formats:
      - "dd/MM/yyyy"
      - "dd/MM"
    date_year_source: "statement_period"
    month_language: "pt-BR"
    amount_locale: "pt-BR"
    decimal_separator: ","
    thousands_separator: "."
    negative_patterns:
      - "- R$ {amount}"
      - "-R$ {amount}"
      - "-{amount}"
    positive_patterns:
      - "+ R$ {amount}"
      - "+R$ {amount}"
      - "+{amount}"
    ignore_rows:
      - "Período do extrato"
      - "Saldo nesse período"
      - "Entrou na sua conta"
      - "Saiu da sua conta"
      - "Pagamentos feitos"
      - "Transferências feitas"
      - "Saques feitos"
      - "Total em tarifas"
      - "Suas movimentações"
      - "Extrato emitido em"
      - "Esse é o resumo"
    opening_balance_rows: []
    opening_balance_policy: skip
    required_transaction_fields:
      - date
      - description
      - amount
    optional_transaction_fields:
      - balance
      - transaction_id
