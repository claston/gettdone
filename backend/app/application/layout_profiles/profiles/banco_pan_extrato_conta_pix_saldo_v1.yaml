  table_detection:
    header_keywords:
      - "Agência"
      - "Conta"
      - "Extrato de"
      - "Suas movimentações"
      - "Extrato emitido em"
    expected_column_order:
      - date
      - transaction_id
      - description
      - amount
      - balance
    column_aliases:
      date:
        - "Data"
      description:
        - "Crédito Pix"
        - "Débito Pix"
        - "Pix recebido"
        - "Pix enviado"
      document:
        - "ID"
        - "Identificador"
      amount:
        - "Valor"
        - "R$"
      balance:
        - "Saldo"
