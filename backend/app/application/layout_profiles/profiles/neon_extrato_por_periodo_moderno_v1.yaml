  table_detection:
    header_keywords:
      - "Descrição"
      - "Data"
      - "Hora"
      - "Valor"
      - "Saldo"
      - "Cartão"
    expected_column_order:
      - description
      - date
      - time
      - amount
      - balance
      - card
    column_aliases:
      date:
