layout_profile:
  schema_version: 2
  profile_name: neon_extrato_por_periodo_moderno_v1
  bank: Neon
  layout_family: neon_extrato_por_periodo_moderno
  statement_type: conta_digital_extrato
  confidence: high
  classifier:
    required_keywords:
      - "neon"
      - "Conta digital"
      - "Neon Pagamentos S.A."
      - "Extrato por período"
      - "Ano Base"
      - "Período de"
      - "Conta-corrente"
    optional_keywords:
