[pytest]
testpaths = backend/tests
addopts = --strict-markers
markers =
    pdf_golden: regression tests for the minimal PDF golden dataset
    pdf_ocr: optional real OCR tests that require a local Tesseract binary
    production_password_hash: tests that intentionally exercise the production PBKDF2 cost
    real_http: tests that start a real local HTTP server
    architecture: tests that validate import and runtime boundaries in fresh processes
